name: Bug report
description: Report a reproducible defect in Agentic Lab.
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities, use [private vulnerability reporting](https://github.com/o-viken/agenticlab/security/advisories/new), not this form.
        Read the [security policy](https://github.com/o-viken/agenticlab/blob/main/SECURITY.md).
        Use synthetic examples. Remove credentials, private prompts, workspace contents, personal data, and internal deployment details from all text and attachments.
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Which release or Git commit did you test?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, .NET SDK, relevant host/agent or enabled example, and browser/Node version when applicable. Do not include credentials or private workspace paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide minimal steps and non-sensitive sample input. State whether this uses a live model or a test fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional minimal error output. Do not paste full flow captures, environment dumps, or unredacted logs. Check screenshots for sensitive data before attaching them.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed secrets and private data from this report and its attachments.
          required: true