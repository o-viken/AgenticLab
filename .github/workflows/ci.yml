name: CI

"on":
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-build-test:
    name: dotnet-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source (checkout v5)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up .NET (setup-dotnet v4.3.1)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AgenticLab.slnx
      - name: Build
        run: dotnet build AgenticLab.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test AgenticLab.slnx --configuration Release --no-build --no-restore