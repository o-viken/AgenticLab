services:
  mcpserver:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcpserver
    container_name: agenticlab-mcpserver
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
    networks:
      - agenticlab

  a2aserver:
    build:
      context: .
      dockerfile: Dockerfile
      target: a2aserver
    container_name: agenticlab-a2aserver
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - Models__Provider=${Models__Provider:-AzureOpenAI}
      - AzureOpenAI__Endpoint=${AzureOpenAI__Endpoint:-}
      - AzureOpenAI__Deployment=${AzureOpenAI__Deployment:-}
      - AzureOpenAI__ApiKey=${AzureOpenAI__ApiKey:-}
      - OpenAI__ApiKey=${OpenAI__ApiKey:-}
      - OpenAI__Model=${OpenAI__Model:-}
      - Gemini__ApiKey=${Gemini__ApiKey:-}
      - Gemini__Model=${Gemini__Model:-}
    networks:
      - agenticlab

  aiservice:
    build:
      context: .
      dockerfile: Dockerfile
      target: aiservice
    container_name: agenticlab-aiservice
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - Models__Provider=${Models__Provider:-AzureOpenAI}
      - AzureOpenAI__Endpoint=${AzureOpenAI__Endpoint:-}
      - AzureOpenAI__Deployment=${AzureOpenAI__Deployment:-}
      - AzureOpenAI__ApiKey=${AzureOpenAI__ApiKey:-}
      - OpenAI__ApiKey=${OpenAI__ApiKey:-}
      - OpenAI__Model=${OpenAI__Model:-}
      - Gemini__ApiKey=${Gemini__ApiKey:-}
      - Gemini__Model=${Gemini__Model:-}
      - services__mcpserver__http__0=http://mcpserver:8080
      - services__a2aserver__http__0=http://a2aserver:8080
    networks:
      - agenticlab
    depends_on:
      - mcpserver
      - a2aserver

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: agenticlab-web
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - services__aiservice__http__0=http://aiservice:8080
    networks:
      - agenticlab
    depends_on:
      - aiservice

networks:
  agenticlab:
    driver: bridge
